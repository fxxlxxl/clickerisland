<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Clicker Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: slim HUD on top, island stage fills the left, shop column on the right (stacks under the island on phones). */
:root{
  --bg:#0b2236;
  --panel:#11304a;
  --panel-hi:#17405f;
  --well:#0c2a40;
  --line:#2f6285;
  --shadow:#06131f;
  --ink:#eaf5f1;
  --ink-dim:#9bbccb;
  --gold:#f5be4e;
  --gold-hi:#ffe3a0;
  --gold-lo:#b97f1e;
  --gold-ink:#2b1a05;
  --wood:#e0a263;
  --stone:#b8c7d3;
  --food:#f6957d;
  --good:#86d873;
  --bad:#ef7d68;
  --sea:#1f5f85;
  --font-display:'Silkscreen','Courier New',ui-monospace,monospace;
  --font-body:'Pixelify Sans','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:500 16px/1.35 var(--font-body);
  -webkit-tap-highlight-color:transparent;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;gap:12px;min-height:0;max-width:1500px;margin:0 auto}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:2px}
.brand{order:0;display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{margin:0;font:700 20px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 0 #5b3d0a}
.brand p{margin:5px 0 0;color:var(--ink-dim);font-size:14px}
.chips{order:3;flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.chip{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 128px;max-width:230px;min-width:128px;padding:6px 10px 9px 7px;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow)}
.chip .ri{width:28px;height:28px;flex:none}
.chip-txt{min-width:0}
.chip-val{display:block;font:700 20px/1 var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:left center}
.chip-rate{display:block;margin-top:3px;font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip-rate.neg{color:var(--bad)}
.chip-cap{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--well)}
.chip-cap i{display:block;height:100%;width:0;background:var(--line);transition:width .3s}
.chip.full{border-color:var(--bad)}
.chip.full .chip-cap i{background:var(--bad)}
.chip.full .chip-rate{color:var(--bad)}
.chip[data-res=wood] .chip-val{color:var(--wood)}
.chip[data-res=stone] .chip-val{color:var(--stone)}
.chip[data-res=food] .chip-val{color:var(--food)}
.chip[data-res=planks] .chip-val{color:#f0d79c}
.chip[data-res=iron] .chip-val{color:#b5c3d0}
.chip[data-res=gold] .chip-val{color:var(--gold)}
.chip[data-res=know] .chip-val{color:#a9b6ff}
.tools{order:1;display:flex;align-items:center;gap:8px}
.tool{background:var(--panel);border:2px solid var(--line);padding:6px 10px;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.tool:hover{border-color:var(--gold)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.tool.armed{background:var(--bad);color:#2a0b05;border-color:var(--bad)}
.saved{font-size:13px;color:var(--good);opacity:0;transition:opacity .4s;min-width:5.5em}
.saved.on{opacity:1}

/* Stage */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--sea);border:3px solid var(--line);box-shadow:0 4px 0 var(--shadow);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#game{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;cursor:default;transform-origin:50% 50%}
#game.hot{cursor:pointer}
#game:focus-visible{outline:3px solid var(--gold);outline-offset:-8px}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;display:flex;align-items:center;gap:6px;font:700 22px/1 var(--font-display);white-space:nowrap;
  text-shadow:0 2px 0 #000b,2px 0 0 #000b,-2px 0 0 #000b,0 -2px 0 #000b;
  animation:floatUp 1s cubic-bezier(.2,.7,.3,1) forwards}
.float .ri{width:20px;height:20px}
.float.crit{font-size:30px;color:var(--gold-hi)}
.float.wood{color:var(--wood)}.float.stone{color:var(--stone)}.float.food{color:var(--food)}.float.planks{color:#f0d79c}.float.iron{color:#b5c3d0}.float.gold{color:var(--gold)}.float.know{color:#a9b6ff}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}
  15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-300%) scale(1)}
}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}
.hint{position:absolute;left:12px;top:12px;margin:0;max-width:min(300px,62%);padding:8px 10px;background:#0b2236d9;border:2px solid var(--line);font-size:14px;color:var(--ink-dim);pointer-events:none;transition:opacity .6s}
.hint.off{opacity:0}
.hint b{color:var(--ink);font-weight:600}
.toasts{position:absolute;bottom:calc(var(--goal-h,90px) + 24px);right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100% - 24px)}
.toast{padding:8px 12px;background:var(--panel);border:2px solid var(--gold);box-shadow:0 3px 0 var(--shadow);font-size:15px;max-width:340px;animation:toastIn .35s cubic-bezier(.3,1.5,.5,1),toastOut .4s 4.4s forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(10px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(12px)}}
.banner{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));text-align:center;padding:16px 18px;background:var(--panel);border:3px solid var(--gold);box-shadow:0 5px 0 var(--shadow);pointer-events:none;animation:bannerIn .6s cubic-bezier(.3,1.6,.5,1),bannerOut .5s 3.6s forwards}
.banner small{display:block;font:700 12px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.banner strong{display:block;margin:8px 0 4px;font:700 24px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.banner span{display:block;color:var(--ink-dim)}
.banner .nb{margin-top:8px;color:var(--gold-hi);font-weight:600}
@keyframes bannerIn{0%{opacity:0;transform:translateX(-50%) scale(.6)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes bannerOut{to{opacity:0;transform:translateX(-50%) translateY(-14px)}}

/* Goal card */
.goal{position:absolute;left:12px;right:12px;bottom:12px;max-width:700px;padding:10px 12px 12px;background:#0b2236ea;border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow)}
.goal h2{margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:700 13px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.goal h2 em{font:500 14px/1.2 var(--font-body);font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink-dim);text-align:right}
.goal-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px}
@media (min-width:900px){.goal-rows{grid-template-columns:repeat(3,minmax(0,1fr))}}
.goal-row{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums;min-width:0}
.goal-row .ri{width:18px;height:18px}
.goal-row .gb{position:relative;height:18px;background:var(--well);border:2px solid var(--line);min-width:0;overflow:hidden}
.goal-row .gb i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0;opacity:.55;transition:width .3s}
.goal-row .gb b{position:relative;display:block;text-align:center;font-weight:600;line-height:14px;white-space:nowrap;text-shadow:0 1px 0 #000a}
.goal-row[data-res=wood] .gb i{background:var(--wood)}
.goal-row[data-res=stone] .gb i{background:var(--stone)}
.goal-row[data-res=food] .gb i{background:var(--food)}
.goal-row[data-res=planks] .gb i{background:#f0d79c}
.goal-row[data-res=iron] .gb i{background:#b5c3d0}
.goal-row[data-res=know] .gb i{background:#a9b6ff}
.goal-row.done .gb i{background:var(--good);opacity:.7}
.goal-row.done .gb{border-color:var(--good)}
.goal-row.bld{margin-top:2px}
.goal-row.bld .ri{width:20px;height:20px}
.bar{height:10px;background:var(--well);border:2px solid var(--line);position:relative;min-width:0}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0;transition:width .3s}
.goal p{margin:6px 0 0;color:var(--ink-dim);font-size:13px}

/* Shop */
.shop{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.tabs{display:flex}
.tab{flex:1 1 auto;min-width:0;position:relative;display:flex;justify-content:center;align-items:center;padding:13px 4px;background:var(--bg);color:var(--ink-dim);border:0;border-bottom:3px solid var(--line);font:700 11px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--panel);color:var(--gold);border-bottom-color:var(--gold)}
.tab:focus-visible,.item:focus-visible,.tool:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.badge{margin-left:4px;min-width:16px;padding:2px 3px;background:var(--good);color:#0b2a0b;font:700 11px/1 var(--font-body);text-align:center}
.shop-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 2px;font-size:14px;color:var(--ink-dim)}
.seg{display:flex}
.seg button{padding:5px 10px;background:var(--well);border:2px solid var(--line);margin-left:-2px;cursor:pointer;font-size:14px;color:var(--ink-dim)}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);position:relative}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px 14px;overscroll-behavior:contain}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:8px;text-align:left;background:var(--panel-hi);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);cursor:pointer}
.item:hover:not(:disabled){border-color:var(--gold)}
.item:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.item.cant{opacity:.6}
.item:disabled{cursor:default;opacity:.5}
.ico-box{flex:none;width:76px;height:76px;display:grid;place-items:center;background:var(--well);border:2px solid var(--line)}
.ico-box canvas{width:72px;height:72px;image-rendering:pixelated}
.ico-box.small canvas{width:48px;height:48px}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item-name{font:700 16px/1.15 var(--font-body);text-wrap:balance}
.item-count{font:700 20px/1 var(--font-body);color:var(--gold);font-variant-numeric:tabular-nums}
.item-desc{font-size:14px;color:var(--ink-dim);line-height:1.25}
.costs{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.cost{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.cost .ri{width:16px;height:16px}
.cost.short{color:var(--bad)}
.item-note{font-size:14px;color:var(--gold)}
.list h3{margin:8px 0 0;font:700 12px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list h3 small{font:500 13px/1 var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-dim)}
.itemw{display:flex;flex-direction:column}
.itemw .item{position:relative}
.itemw.has-pause .item{box-shadow:none}
.pausebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;background:var(--well);border:2px solid var(--line);border-top:0;box-shadow:0 3px 0 var(--shadow);font-size:13px;color:var(--ink-dim)}
.pausebar button{background:var(--panel);border:2px solid var(--line);padding:3px 8px;font-size:13px;cursor:pointer}
.pausebar button:hover{border-color:var(--gold)}
.pausebar[data-off=true]{border-color:var(--bad);color:var(--bad)}
.item-note.warn{color:var(--bad)}
.item-note.dim{color:var(--ink-dim)}
.item.done-card{opacity:.7;border-color:var(--good)}
.unlock-hint{margin:0;padding:8px 10px;background:var(--well);border:2px dashed var(--line);font-size:14px;color:var(--ink-dim)}
.unlock-hint b{color:var(--ink);font-weight:600}
.seg.small button{padding:4px 8px;font-size:13px}
.ri{image-rendering:pixelated;display:inline-block;flex:none}

/* Extras: pills, buff, achievements, "Mehr" panel */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;background:var(--panel);border:2px solid var(--line);font-size:14px;white-space:nowrap}
.pill .ri{width:16px;height:16px}
.pill b{color:#f3dcff;font-variant-numeric:tabular-nums}
.buff{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 12px;background:#0b2236ea;border:2px solid var(--good);color:var(--good);font:700 12px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;pointer-events:none;white-space:nowrap}
.info{margin:0;padding:8px 10px;background:var(--well);border:2px solid var(--line);font-size:14px;color:var(--ink-dim)}
.info b{color:var(--ink);font-weight:600}
.ach{display:flex;gap:12px;align-items:center;padding:8px;background:var(--panel-hi);border:2px solid var(--line);opacity:.72}
.ach.got{opacity:1;border-color:var(--gold)}
.ach .ico-box{width:56px;height:56px}
.ach .ico-box canvas{width:48px;height:48px;image-rendering:pixelated}
.ach:not(.got) canvas{filter:grayscale(1) brightness(.55)}
.ach-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ach-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ach-name{font-weight:700}
.ach-tag{color:var(--gold);font-size:14px;white-space:nowrap}
.ach-desc{font-size:14px;color:var(--ink-dim);line-height:1.25}
.ach .bar{height:8px}
.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:flex;gap:10px;align-items:center;padding:8px;background:var(--panel-hi);border:2px solid var(--line)}
.quest.ready{border-color:var(--good);box-shadow:0 0 0 2px #7fd9a840}
.quest .ico-box{width:48px;height:48px}
.quest .ico-box canvas{width:40px;height:40px;image-rendering:pixelated}
.quest-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.quest-name{font-weight:700;line-height:1.2}
.quest .bar{height:8px}
.quest.ready .bar i{background:var(--good)}
.quest-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.quest-rw{display:inline-flex;flex-wrap:wrap;gap:0 10px;align-items:center;color:var(--gold)}
.quest-rw span{display:inline-flex;align-items:center;gap:3px}
.quest-rw .ri{width:14px;height:14px}
.quest-btn{flex:none;padding:10px 12px}
.item.pulse{border-color:var(--gold);animation:pulseHint 1.3s ease-in-out infinite}
@keyframes pulseHint{0%,100%{box-shadow:0 3px 0 var(--shadow),0 0 0 0 #f5be4e00}50%{box-shadow:0 3px 0 var(--shadow),0 0 0 4px #f5be4e88}}
.sec{display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--panel-hi);border:2px solid var(--line)}
.sec h3{margin:0;font:700 12px/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sec p{margin:0;font-size:14px;color:var(--ink-dim);line-height:1.3}
.sec p b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:14px}
.stats dt{color:var(--ink-dim)}
.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.btn{background:var(--gold);color:var(--gold-ink);border:0;padding:10px 12px;font:700 14px/1 var(--font-body);cursor:pointer;box-shadow:inset -3px -3px 0 var(--gold-lo),inset 3px 3px 0 var(--gold-hi),0 3px 0 #5b3d0a}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset -3px -3px 0 var(--gold-lo),inset 3px 3px 0 var(--gold-hi),0 0 0 #5b3d0a}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--well);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--shadow)}
.btn.ghost:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--line),0 0 0 var(--shadow)}
.btn.armed{background:var(--bad);color:#2a0b05;box-shadow:inset -3px -3px 0 #a8452f,inset 3px 3px 0 #ffb3a2,0 3px 0 #4a1c10}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.msg{min-height:1.3em;font-size:14px;color:var(--ink-dim)}
.msg.ok{color:var(--good)}
.msg.err{color:var(--bad)}
textarea{width:100%;min-height:76px;padding:8px;background:var(--well);color:var(--ink);border:2px solid var(--line);font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.float.auto{font:700 14px/1 var(--font-display);animation:floatSmall 1.8s ease-out forwards}
.float.msg{color:var(--gold-hi);font-size:18px}
@keyframes floatSmall{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-64px)}}

/* Wave 2: residents, journeys, events, perks */
.pill.sm b{color:var(--ink)}
.pill#starPill b{color:var(--gold-hi)}
.pill#popPill.hungry{border-color:var(--bad)}
.pill#popPill.hungry b{color:var(--bad)}
.tab[hidden]{display:none}
.event{position:absolute;left:50%;top:46px;transform:translateX(-50%);z-index:6;width:min(390px,calc(100% - 24px));padding:10px 12px 12px;background:#0b2236f4;border:3px solid var(--gold);box-shadow:0 5px 0 var(--shadow);animation:bannerIn .35s cubic-bezier(.3,1.4,.5,1)}
.event h2{margin:0 0 4px;display:flex;align-items:center;gap:8px;font:700 13px/1.2 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.event h2 canvas{width:28px;height:28px;image-rendering:pixelated;flex:none}
.event p{margin:0 0 6px;font-size:14px;color:var(--ink-dim);line-height:1.3}
.event .opts{display:flex;flex-direction:column;gap:6px}
.event .opt{display:flex;flex-direction:column;gap:2px;width:100%;padding:7px 9px;text-align:left;background:var(--panel-hi);border:2px solid var(--line);box-shadow:0 3px 0 var(--shadow);cursor:pointer}
.event .opt:hover:not(:disabled){border-color:var(--gold)}
.event .opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.event .opt:disabled{opacity:.55;cursor:default}
.event .opt b{font:700 15px/1.2 var(--font-body)}
.colbox{display:flex;flex-direction:column;gap:8px}
.event .row{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.event .row .lbl{color:var(--ink-dim)}
.event .row span.c{display:inline-flex;align-items:center;gap:3px}
.event .row span.c .ri{width:15px;height:15px}

function sanitize(d) {
  if (!d || typeof d !== 'object') return null;
  const f = fresh();
  /* meta that survives every version */
  f.saved = num(d.saved, Date.now());
  f.sound = d.sound !== false;
  f.play = Math.max(0, num(d.play));
  f.pearls = Math.max(0, Math.floor(num(d.pearls)));
  f.runs = Math.max(0, Math.floor(num(d.runs)));
  f.all = Math.max(0, num(d.all));
  f.crits = Math.max(0, Math.floor(num(d.crits)));
  f.finds = Math.max(0, Math.floor(num(d.finds)));
  f.clicks = Math.max(0, Math.floor(num(d.clicks)));
  f.qdone = Math.max(0, Math.floor(num(d.qdone)));
  f.day = d.day === 'day' || d.day === 'night' ? d.day : 'auto';
  f.fx = d.fx === 'lite' ? 'lite' : 'full';
  if (d.ach && typeof d.ach === 'object') for (const a of ACH) if (d.ach[a.id]) f.ach[a.id] = num(d.ach[a.id], 1) || 1;
  f.relics = Math.min(RELIC_MAX, Math.max(0, Math.floor(num(d.relics))));
  f.stars = Math.max(0, Math.floor(num(d.stars)));
  f.eras = Math.max(0, Math.floor(num(d.eras)));
  f.expDone = Math.max(0, Math.floor(num(d.expDone)));
  f.evDone = Math.max(0, Math.floor(num(d.evDone)));
  if (d.daily && typeof d.daily === 'object') {
    const dl = d.daily, cnt = v => Math.min(99999, Math.max(0, Math.floor(num(v))));
    f.daily = { last: /^\d{4}-\d{2}-\d{2}$/.test(String(dl.last)) ? String(dl.last) : '', streak: cnt(dl.streak), best: cnt(dl.best), n: cnt(dl.n) };
    f.daily.best = Math.max(f.daily.best, f.daily.streak);
  }
  if (num(d.v) < 4) { f.mig = true; return f; }   /* old economy: the island starts over, meta stays */
  f.spent = Math.max(0, Math.floor(num(d.spent)));
  if (d.perks && typeof d.perks === 'object') for (const p of PERKS) f.perks[p.id] = Math.min(p.max, Math.max(0, Math.floor(num(d.perks[p.id]))));
  f.spent = Math.min(f.spent, f.pearls);
  f.evNext = Math.max(0, num(d.evNext, 480));
  for (const r of RES) {
    f.res[r] = Math.max(0, num(d.res && d.res[r]));
    f.total[r] = Math.max(f.res[r], num(d.total && d.total[r]));
  }
  for (const b of BUILDINGS) f.bld[b.id] = Math.min(b.max, Math.max(0, Math.floor(num(d.bld && d.bld[b.id]))));
  for (const u of UPGRADES) f.upg[u.id] = Math.min(u.max, Math.max(0, Math.floor(num(d.upg && d.upg[u.id]))));
  if (d.off && typeof d.off === 'object') for (const b of PRODUCERS) if (d.off[b.id] && b.inp) f.off[b.id] = true;
  f.stage = Math.min(MILESTONES.length, Math.max(0, Math.floor(num(d.stage))));
  f.all = Math.max(f.all, RES.reduce((a, r) => a + f.total[r], 0));
  if (Array.isArray(d.exp)) {
    for (const e of d.exp.slice(0, 6)) {
      if (!e || !EXMAP[e.t] || !Number.isFinite(e.end) || !e.rew || typeof e.rew !== 'object') continue;
      const rew = {}; for (const r of RES) if (num(e.rew[r]) > 0) rew[r] = num(e.rew[r]);
      f.exp.push({ t: e.t, end: e.end, rew, relic: !!e.relic, storm: !!e.storm });
    }
  }
  if (d.ev && typeof d.ev === 'object' && EVMAP[d.ev.id] && Array.isArray(d.ev.opts) && Number.isFinite(d.ev.until)) {
    const ok = d.ev.opts.every(o => o && typeof o.label === 'string' && o.cost && o.gain);
    if (ok) f.ev = { id: d.ev.id, until: d.ev.until, opts: d.ev.opts.slice(0, 3).map(o => ({ label: String(o.label).slice(0, 80), cost: cleanVec(o.cost), gain: cleanVec(o.gain), buff: o.buff && num(o.buff.m) > 1 ? { m: Math.min(3, num(o.buff.m)), sec: Math.min(900, num(o.buff.sec)) } : null })) };
  }
  if (d.evBuff && num(d.evBuff.m) > 1 && Number.isFinite(d.evBuff.until)) f.evBuff = { m: Math.min(3, num(d.evBuff.m)), until: d.evBuff.until };
  if (Array.isArray(d.quests)) {
    for (const q of d.quests.slice(0, 3)) {
      if (!q || !QMAP[q.t] || !(num(q.need) > 0) || !(num(q.rw) > 0) || !Number.isFinite(q.base)) continue;
      if (f.quests.some(o => o.t === q.t)) continue;
      f.quests.push({ t: q.t, need: q.need, base: q.base, rw: q.rw });
    }
  }
  return f;
}
function cleanVec(v) { const o = {}; for (const r of RES) if (v && num(v[r]) > 0) o[r] = num(v[r]); return o; }
function loadSave() {

}
/* export / import code: "CI1:" + base64(json) */
function encodeSave() {
  S.saved = Date.now();
  return 'CI1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
}
function decodeSave(text) {
  try {
    const t = String(text || '').replace(/\s+/g, '');
    if (!t.startsWith('CI1:')) return null;
    return sanitize(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))));
  } catch (e) { return null; }
}
function writeSave() {

    S.saved = Date.now();
    delete S.mig;

const ulv = id => S.upg[id] || 0;
const own = id => S.bld[id] || 0;

let buffLeft = 0; /* seconds of "Rückenwind" left, not saved */
const achCount = () => Object.keys(S.ach).length;
const pearlMult = () => 1 + 0.04 * S.pearls;
const achMult = () => 1 + 0.005 * achCount();
const gMult = () => pearlMult() * achMult() * starMult() * relicMult() * evMult() * (buffLeft > 0 ? BUFF_MULT : 1);

/* residents: every Wohnhaus holds `housing` people, they eat first and well-fed people lift the output of every building */
const POP_BONUS = 0.0025;
let popFed = 1;                       /* 0..1, how well the residents ate lately (not saved) */
const homeMult = () => { let m = own('w_gardens') ? 1.5 : 1; for (const u of UPGRADES) if (u.fx && u.fx.kind === 'home') { const l = ulv(u.id); if (l) m *= u.fx.f(l); } return m; };
const popN = () => Math.floor(own('house') * HOUSE.housing * homeMult() + 1e-9);
const eatRate = () => 0.1 * Math.pow(1.5, S.stage);
const popNeed = () => popN() * eatRate();
const popMult = () => 1 + POP_BONUS * popN() * popFed;

const capOf = () => Math.floor(CAP0 * Math.pow(3, ulv('storage')));
const inMult = () => Math.max(0.3, 1 - 0.04 * ulv('eff'));
const costMul = () => Math.max(0.5, 1 - 0.03 * ulv('logistik') - 0.02 * perk('build'));
const needMul = () => Math.max(0.5, 1 - 0.03 * perk('quick'));
const offlineEff = () => Math.min(0.95, 0.4 + 0.1 * ulv('night') + 0.06 * perk('sleep'));

const covers = (to, b) => to === 'all' || to.indexOf(b.id) >= 0;
function boostMul(b) {
  let add = 0;
  for (const k of BOOSTERS) {
    const n = own(k.id); if (!n) continue;
    if (covers(k.boost.to, b)) add += k.boost.pct * n;
    if (k.boost2 && covers(k.boost2.to, b)) add += k.boost2.pct * n;
  }
  return 1 + add;
}
function bMult(b) {
  let m = gMult() * boostMul(b) * popMult();
  if (b.res === 'know') m *= 1 + 0.1 * perk('scholar');
  for (const u of UP_OUT[b.id]) { const l = ulv(u.id); if (l) m *= u.fx.f(l); }
  return m;
}
const bRate = b => b.rate * bMult(b);
const inRate = (b, r) => b.inp[r] * inMult();

/* click */
function clickFlat(r) {
  const base = r === 'wood' ? 1 + ulv('axe') : 1 + ulv('pick');
  return base * Math.pow(2, ulv('arms')) * pearlMult() * (1 + 0.25 * perk('hands')) * starMult();
}
const helperRate = r => 0.25 * ulv('helper') * clickFlat(r) * achMult() * evMult() * (buffLeft > 0 ? BUFF_MULT : 1);

/* steady-state rates (what the buildings would deliver per second without stock help) */
function rates() {
  const gross = {}, use = {}, eff = {};
  for (const r of RES) { gross[r] = 0; use[r] = 0; }
  gross.wood += helperRate('wood'); gross.stone += helperRate('stone');
  use.food += popNeed() * popFed;
  for (const b of PRODUCERS) {
    const n = own(b.id);
    if (!n || S.off[b.id]) { eff[b.id] = n ? 0 : 1; continue; }

let AC = null;

    gn.gain.setValueAtTime(vol || 0.04, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* audio unavailable */ }
}

/* palms on the sandy rim of each stage (odd cells only, so they never touch the huts) */
for (let k = 1; k <= 8; k++) {
  let n = 0;
  for (const c of CELLS) {
    if (c.st > k || ((c.i + c.j) & 1) === 0 || !isRim(c, k)) continue;
    if (c.st < k - 1 && k > 1) continue;
    if (hash(c.i, c.j, 11 + k) < 0.34 && n < 5) { DECOR.push({ kind: 'palm', i: c.i, j: c.j, st: k }); n++; }
  }
}

function puff(x, y, t, n, col) {
  for (let k = 0; k < n; k++) {
    const ph = ((t * 0.7) + k / n) % 1;
    const px = x + Math.round(Math.sin(ph * 5 + k * 2) * 2), py = y - ph * 16, sz = 2 + Math.round(ph * 2);
    g.globalAlpha = (1 - ph) * 0.65;
    R(px, py, sz, sz, col || '#e9eef1');
  }
  g.globalAlpha = 1;
}

function sLumber(x, y, t) {

  R(x - 21, y - 2, 8, 3, P.woodR); R(x - 21, y - 2, 8, 1, P.woodL); R(x - 14, y - 2, 2, 3, P.woodLt);
  box(x, y, 10, 9, P.woodL, P.woodL, P.woodR);
  wallRect('r', x, y - 9, 10, 3, 6, 3, 9, P.woodDk);
  wallRect('l', x, y - 9, 10, 3, 6, 2, 5, '#ffe7a0');

}

function sPalm(x, y, t) {
  const sw = Math.sin(t * 1.4 + x * 0.3);
  let tx = x, ty = y;
  for (let k = 0; k < 15; k++) {
    const px = x + Math.round(Math.sin(k / 15 * 1.4) * 3), py = y - k;
    R(px, py, 2, 1, k % 3 ? '#a06f40' : '#7d522e'); tx = px; ty = py;
  }
  for (let q = 0; q < 6; q++) {
    const a = q * Math.PI / 3 + 0.35;
    const ex = tx + 1 + Math.cos(a) * 10 + sw * 1.5, ey = ty + Math.sin(a) * 3 + 4 + Math.abs(Math.cos(a)) * 2;
    line(tx + 1, ty, ex, ey, '#2f8a3a', 2);
    line(tx + 1, ty - 1, ex, ey - 1, '#62c258', 1);
  }
  R(tx, ty + 2, 2, 2, '#6b4425'); R(tx + 2, ty + 2, 2, 2, '#5a371d');
}
function sPier(x, y, len, t) {
  for (let k = 0; k < len; k++) {
    const px = x + k * 8, py = y + k * 4;
    R(px - 6, py + 3, 2, 6, '#5e371d'); R(px + 4, py + 3, 2, 6, '#5e371d');
  }
  for (let k = 0; k < len; k++) {
    const px = x + k * 8, py = y + k * 4;
    diamond(px, py, 10, k & 1 ? '#b98048' : '#c48c52');
  }
}
function sBoat(x, y, t, big) {

}
function sLighthouse(x, y, t) {
  R(x - 8, y - 2, 16, 3, '#7e8791');
  for (let r = 0; r < 34; r++) {
    const half = 6 - fl(r / 9), red = fl(r / 6) % 2 === 1;
    R(x - half, y - r, half, 1, red ? '#dc5a46' : P.white);
    R(x, y - r, half, 1, red ? '#b24432' : '#cfcfc4');
  }
  R(x - 7, y - 36, 14, 2, '#343b45'); R(x - 5, y - 37, 10, 1, '#4b535e');
  const glow = 0.5 + 0.5 * Math.sin(t * 3);
  R(x - 4, y - 43, 8, 6, '#2c333c');
  R(x - 3, y - 42, 6, 4, glow > 0.5 ? '#fff0a0' : '#ffd45a');
  for (let k = 0; k < 5; k++) R(x - 5 + k, y - 44 - k, 10 - 2 * k, 1, '#dc5a46');
  /* rotating beam */
  const a = t * 0.9;
  g.globalAlpha = 0.12 + 0.1 * glow;
  for (let w = -2; w <= 2; w++) line(x, y - 40, x + Math.cos(a) * 80, y - 40 + Math.sin(a) * 34 + w, '#fff0a0', 1);
  g.globalAlpha = 1;
  light(x, y - 40, 11, '#fff0a0', 0.6);
  lightFn(() => {
    g.globalAlpha = 0.2;
    for (let w = -3; w <= 3; w++) line(x, y - 40, x + Math.cos(a) * 95, y - 40 + Math.sin(a) * 40 + w, '#fff0a0', 1);
    g.globalAlpha = 1;
  });
}
function sWindmill(x, y, t) {
  R(x - 9, y - 2, 18, 3, '#9b8a62');
  for (let r = 0; r < 22; r++) {
    const half = 7 - fl(r / 6);
    R(x - half, y - r, half, 1, '#eadbb0'); R(x, y - r, half, 1, '#c3ad7c');
  }
  R(x + 1, y - 7, 4, 7, P.woodDk);
  for (let k = 0; k < 5; k++) R(x - 5 + k, y - 22 - k, 10 - 2 * k, 1, P.roofRR);
  const hx = x, hy = y - 20, ang = t * 0.9;
  for (let q = 0; q < 4; q++) {
    const a = ang + q * Math.PI / 2, c = Math.cos(a), s = Math.sin(a);
    line(hx, hy, hx + c * 17, hy + s * 17, P.woodDk, 2);
    line(hx + c * 6 - s, hy + s * 6 + c, hx + c * 17 - s, hy + s * 17 + c, '#f3f1e8', 3);
  }
  R(hx - 1, hy - 1, 3, 3, '#4a2c18');
}
function sField(x, y, alt) {
  const hw = 14, top = y - (hw >> 1);
  for (let k = 0; k < hw; k++) {
    const half = 2 * Math.min(k + 1, hw - k);
    for (let xx = -half; xx < half; xx += 2) {
      const stripe = fl((xx - 2 * (k - 7) * (alt ? -1 : 1)) / 6) & 1;
      R(x + xx, top + k, 2, 1, stripe ? '#d9b64c' : '#c49b36');
    }
  }
  R(x - 3, y - 2, 1, 2, '#f1d878'); R(x + 5, y + 1, 1, 2, '#f1d878'); R(x - 8, y + 1, 1, 2, '#f1d878');
}
function sCastle(x, y, t) {

  R(x - 14, y - 40, 1, 8, '#4a2c18'); R(x + 14, y - 40, 1, 8, '#4a2c18');

function sBird(x, y, f) {

/* island workers: tiny 3x8 figures */
const WORK_COL = { helperW: ['#3a8fd8', '#f5be4e', '#c4864d'], helperS: ['#3a8fd8', '#f5be4e', '#cfd6dc'], lumber: ['#d4503f', '#6d4426', '#c4864d'], quarry: ['#e0b43c', '#f5be4e', '#b6c2cc'], fisher: ['#4aa0c8', '#f3f1e8', '#f6957d'],
  v0: ['#4a7fc4', '#6d4426', '#fff'], v1: ['#c4504a', '#2e2420', '#fff'], v2: ['#e0b43c', '#9a6238', '#fff'], v3: ['#5fae4a', '#1f1f28', '#fff'], v4: ['#a86cc4', '#c49a4a', '#fff'], v5: ['#ece7d8', '#5a3a22', '#fff'] };
function sWorker(x, y, id, state, carry, t, ph) {
  const c = WORK_COL[id];
  const step = state === 'walk' ? (fl(t * 9 + ph * 5) & 1) : 0;
  const hop = state === 'work' ? (Math.sin(t * 16 + ph * 9) > 0 ? -1 : 0) : 0;
  g.globalAlpha = 0.25; R(x - 2, y, 5, 1, '#000'); g.globalAlpha = 1;
  if (step) { R(x - 1, y - 2, 1, 2, '#3a2a22'); R(x + 1, y - 1, 1, 1, '#3a2a22'); }
  else { R(x - 1, y - 1, 1, 1, '#3a2a22'); R(x + 1, y - 2, 1, 2, '#3a2a22'); }
  R(x - 1, y - 5 + hop, 3, 3, c[0]);
  R(x - 1, y - 8 + hop, 3, 3, '#f0b48a');
  R(x - 1, y - 8 + hop, 3, 1, c[1]);
  if (carry) R(x - 1, y - 10 + hop, 3, 2, c[2]);
  if (state === 'work') {
    if (id === 'fisher') { line(x + 2, y - 6, x + 8, y - 11, '#8a5530', 1); R(x + 8, y - 11, 1, 7, '#e9eef1'); R(x + 7, y - 4, 3, 1, '#e5533d'); }
    else { R(x + 2, y - 8 + hop, 1, 5, '#8a5530'); R(x + 2, y - 9 + hop, 3, 1, '#cfd6dc'); }
  }
}

function stageBox(stage) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const c of CELLS) {
    if (c.st > stage) continue;
    const x = sx(c.i, c.j), y = sy(c.i, c.j);
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  const up = stage >= 7 ? 72 : stage >= 6 ? 64 : stage >= 5 ? 56 : stage >= 2 ? 50 : stage >= 1 ? 30 : 26;
  return { x0: x0 - TW - 14, x1: x1 + TW + 14, y0: y0 - TH - up, y1: y1 + TH + WALL + (stage >= 1 ? 22 : 12) };
}

function rebuildCache() {
  const st = S.stage;
  cache.stage = st;
  cache.cells = CELLS.filter(c => c.st <= st).sort((a, b) => (a.i + a.j) - (b.i + b.j) || a.i - b.i);
  cache.ring1 = []; cache.ring2 = [];
  const near = (i, j, r) => { for (let di = -r; di <= r; di++) for (let dj = -r; dj <= r; dj++) if (cellAt(i + di, j + dj, st)) return true; return false; };
  for (let i = -GRID - 2; i <= GRID + 2; i++) for (let j = -GRID - 2; j <= GRID + 2; j++) {
    if (cellAt(i, j, st)) continue;
    if (near(i, j, 1)) cache.ring1.push({ i, j }); else if (near(i, j, 2)) cache.ring2.push({ i, j });
  }
}

function seedAmbient() {
  specks = [];

  for (let k = 0; k < n; k++) specks.push({ x: hash(k, 1, 90) * W, y: hash(k, 2, 90) * H, ph: hash(k, 3, 90) * 6.28, sp: 0.6 + hash(k, 4, 90) * 1.2 });

}

function layout(animate) {
  const cw = stageEl.clientWidth, ch = stageEl.clientHeight;
  if (!cw || !ch) return;
  const bx = stageBox(S.stage), bw = bx.x1 - bx.x0, bh = bx.y1 - bx.y0;
  const goalH = (goalEl.offsetHeight || 90) + 12;
  stageEl.style.setProperty('--goal-h', (goalEl.offsetHeight || 90) + 'px');
  const topPad = 28;
  const availW = cw - 12, availH = Math.max(120, ch - goalH - topPad - 8);
  let s = Math.min(availW / bw, availH / bh);
  s = s >= 2 ? Math.floor(s) : Math.max(1, s);
  s = Math.min(s, 6);
  const prevSC = SC;
  SC = s;
  W = Math.ceil(cw / SC); H = Math.ceil(ch / SC);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; seedAmbient(); }
  const tx = W / 2, ty = (topPad + availH / 2) / SC;
  OX = Math.round(tx - (bx.x0 + bx.x1) / 2);
  OY = Math.round(ty - (bx.y0 + bx.y1) / 2);
  cv.style.width = (W * SC) + 'px';
  cv.style.height = (H * SC) + 'px';
  cv.style.left = ((cw - W * SC) / 2) + 'px';
  cv.style.top = ((ch - H * SC) / 2) + 'px';
  cv.style.transformOrigin = (W * SC / 2) + 'px ' + (ty * SC) + 'px';
  ctx.imageSmoothingEnabled = false;
  if (animate && !reduceMotion && prevSC && Math.abs(prevSC - SC) > 0.01) {
    cv.style.transition = 'none';
    cv.style.transform = 'scale(' + (prevSC / SC) + ')';
    void cv.offsetWidth;
    cv.style.transition = 'transform 1s cubic-bezier(.22,.8,.25,1)';
    cv.style.transform = 'none';
  }
}

function visCount(b) {

function rebuildWorkers() {

  for (const b of PRODUCERS) {
    if (b.id !== 'lumber' && b.id !== 'quarry' && b.id !== 'fisher') continue;
    const avail = slotsOf(b.id);
    for (let k = 0; k < shown[b.id]; k++) {
      workers.push({ id: b.id, k, i: avail[k][0], j: avail[k][1], ph: hash(k, b.id.length, 7), per: 6.5 + hash(k, 3, 8) * 3, hitT: 0 });

}
function riseCells(pred) {
  for (const c of CELLS) {
    if (!pred(c)) continue;
    const dist = Math.hypot(c.i, c.j);
    const t0 = T + 0.35 + dist * 0.09;
    appear.set('c:' + c.key, t0);

const ease = {
  bounce(p) { const n = 7.5625, d = 2.75; if (p < 1 / d) return n * p * p; if (p < 2 / d) { p -= 1.5 / d; return n * p * p + 0.75; } if (p < 2.5 / d) { p -= 2.25 / d; return n * p * p + 0.9375; } p -= 2.625 / d; return n * p * p + 0.984375; },
  back(p) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};

function burst(x, y, cols, n, spd, up) {
  if (reduceMotion) n = Math.ceil(n / 3);
  if (S.fx === 'lite') n = Math.ceil(n / 2);
  for (let k = 0; k < n; k++) parts.push({
    x, y, vx: (Math.random() - 0.5) * spd, vy: -(Math.random() * spd * 0.8 + (up || 20)),
    life: 0, max: 0.45 + Math.random() * 0.4, c: cols[k % cols.length], s: Math.random() < 0.4 ? 2 : 1

}

function hotEffect(type, crit) {

  if (type === 'wood') burst(p.x, p.y, ['#4aa646', '#2f7d34', '#86dc70', '#8a5530', '#c4864d'], crit ? 16 : 7, 60, 25);
  else burst(p.x, p.y + 4, ['#d6dfe6', '#8f9ca7', '#75828d', '#ffe27a'], crit ? 16 : 7, 60, 25);
}

function toLogical(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}
function hitTest(lx, ly) {
  const w = hotPos('wood'), r = hotPos('stone');
  const dw = Math.hypot((lx - w.x) * 0.8, ly - w.y), dr = Math.hypot((lx - r.x) * 0.8, ly - r.y);
  if (Math.min(dw, dr) <= 24) return dw <= dr ? 'wood' : 'stone';
  for (const off of [0, 12]) {
    const dx = lx - OX, dy = ly + off - OY;
    const i = Math.round((dx / TW + dy / TH) / 2), j = Math.round((dy / TH - dx / TW) / 2);
    if (cellAt(i, j, S.stage)) return dw <= dr ? 'wood' : 'stone';
  }
  return null;
}

const mapCv = document.createElement('canvas'); mapCv.width = MAP_W; mapCv.height = MAP_H; mapCv.id = 'mapCv';
function drawMiniMap(t) {
  const prevG = g, prevN = NIGHT;

  R(0, 0, MAP_W, MAP_H, P.seaB);

  g.globalAlpha = 0.25;
  for (const id in ISLE_POS) { const [px, py] = ISLE_POS[id]; for (let k = 0; k < 14; k++) { const q = k / 14; if (k & 1) R(Math.round(160 + (px - 160) * q), Math.round(92 + (py - 92) * q), 2, 1, '#ffffff'); } }
  g.globalAlpha = 1;

  for (const [dx, dy] of [[-16, 1], [14, 3], [-4, 8], [8, -3]]) { R(160 + dx, 84 + dy, 2, 5, '#6b4425'); disc(160 + dx + 1, 83 + dy, 3, '#3d9a3a'); }
  R(155, 86, 6, 5, '#d1ab70'); R(155, 83, 6, 3, '#cf5a42'); R(168, 90, 5, 4, '#efe6d0'); R(168, 87, 5, 3, '#4a6cb8');
  const list = [];
  for (const b of BUILDINGS) if (b.isle) list.push(b);
  list.sort((a, b) => ISLE_POS[a.id][1] - ISLE_POS[b.id][1]);
  for (const b of list) {
    const [px, py] = ISLE_POS[b.id], have = own(b.id) > 0, open = bUnlocked(b);
    if (!have) g.globalAlpha = open ? 0.42 : 0.14;
    sIsle(px, py, t + px, ISLE_KIND[b.id]);

    if (!have && !open) { R(px - 3, py - 14, 7, 1, '#cfe8f0'); R(px - 3, py - 14, 1, 6, '#cfe8f0'); R(px + 3, py - 14, 1, 6, '#cfe8f0'); R(px - 3, py - 8, 7, 5, '#cfe8f0'); R(px, py - 6, 1, 2, '#11304a'); }

  S.exp.forEach((x, n) => {

}

/* ---------- villagers: residents stroll between the houses, the fire and the landmarks ---------- */
const villagers = [];
let vilT = 0;
const STROLL = new Set(['market', 'temple', 'castle', 'windmill', 'lighthouse', 'w_tree', 'w_pyramid', 'w_colossus', 'w_gardens', 'w_gate']);
function villagePlaces() {
  const pl = [{ x: sx(0, 0), y: sy(0, 0) + 9 }];
  const slots = slotsOf('house');
  for (let k = 0; k < (shown.house || 0); k++) pl.push({ x: sx(slots[k][0], slots[k][1]) + 1, y: sy(slots[k][0], slots[k][1]) + 10 });
  DECOR.forEach((d, idx) => { if (STROLL.has(d.kind) && shownDecor.has(idx)) pl.push({ x: sx(d.i, d.j), y: sy(d.i, d.j) + 10 }); });
  return pl;
}
function pickStroll(v, pl) {
  let best = null, bd = 1e9;
  for (let n = 0; n < 3; n++) {
    const c = pl[Math.floor(Math.random() * pl.length)], d = Math.hypot(c.x - v.x, c.y - v.y);
    if (d > 6 && d < bd) { best = c; bd = d; }
  }
  if (best) { v.tx = best.x + (Math.random() - 0.5) * 8; v.ty = best.y + (Math.random() - 0.5) * 3; }
  else v.wait = 1 + Math.random() * 2;
}
function updateVillagers() {
  const dt = Math.min(0.1, Math.max(0, T - vilT)); vilT = T;
  const houses = (shown.house || 0);
  const want = S.fx === 'lite' || !houses ? 0 : Math.min(12, 1 + Math.floor(houses * 0.45));
  if (villagers.length > want) villagers.length = want;
  const pl = villagePlaces();
  while (villagers.length < want) {
    const home = pl[1 + Math.floor(Math.random() * (pl.length - 1))] || pl[0];
    villagers.push({ x: home.x, y: home.y, tx: home.x, ty: home.y, wait: Math.random() * 3, spd: 6 + Math.random() * 3, col: villagers.length % 6, ph: Math.random() });
  }
  for (const v of villagers) {
    if (v.wait > 0) { v.wait -= dt; if (v.wait <= 0) pickStroll(v, pl); continue; }
    const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
    if (d < 0.8) { v.wait = 2 + Math.random() * 5; continue; }
    const st = Math.min(d, v.spd * dt);

  }
}

/* ---------- expedition ships sailing past the edge of the picture and back ---------- */

/* ---------- island workers ---------- */
function workerPos(w, t) {
  const hx = sx(w.i, w.j), hy = sy(w.i, w.j) + 7;
  let tx, ty;
  if (w.id === 'lumber') { tx = sx(GROVE.i, GROVE.j) + 6; ty = sy(GROVE.i, GROVE.j) + 9; }
  else if (w.id === 'quarry') { tx = sx(ROCKS.i, ROCKS.j) - 4; ty = sy(ROCKS.i, ROCKS.j) + 7; }

/* ---------- drifting finds ---------- */
function spawnDrift() {
  const fromLeft = Math.random() < 0.5;
  const yMax = Math.max(70, (stageEl.clientHeight - (goalEl.offsetHeight || 90) - 40) / SC);
  drift = { kind: Math.random() < 0.65 ? 'chest' : 'bottle', x: fromLeft ? -16 : W + 16, y: 20 + Math.random() * (yMax - 26), vx: (fromLeft ? 1 : -1) * (15 + Math.random() * 6), ph: Math.random() * 6 };

}
function updateDrift(dt) {
  if (!drift) {
    driftTimer -= dt;
    if (driftTimer <= 0) { spawnDrift(); driftTimer = 45 + Math.random() * 60; }
    return;
  }
  drift.x += drift.vx * dt;
  if (drift.x < -24 || drift.x > W + 24) drift = null;
}
function driftPos() { return drift ? { x: Math.round(drift.x), y: Math.round(drift.y + Math.sin(T * 1.8 + drift.ph) * 2) } : null; }

  const p = driftPos();

  g.globalAlpha = 0.2 + 0.1 * Math.sin(T * 4); disc(p.x, p.y - 5, 12, '#ffe27a'); g.globalAlpha = 1;
  (drift.kind === 'chest' ? sChest : sBottle)(p.x, p.y, T);
  for (let k = 0; k < 4; k++) { const a = T * 2 + k * Math.PI / 2; R(p.x + Math.cos(a) * 11, p.y - 5 + Math.sin(a) * 7, 2, 1, '#fff3b0'); }

}
function driftHit(lx, ly) {
  const p = driftPos();
  return !!p && Math.hypot(lx - p.x, (ly - (p.y - 4)) * 0.9) <= 15 + 8 / SC;
}

function render(dt) {
  g = ctx;
  T += dt;
  lights.length = 0;
  updateNight(dt);
  updateWeather(dt);
  updateDrift(dt);
  for (const k in hot) hot[k] = Math.max(0, hot[k] - dt * 3.2);
  for (let k = pending.length - 1; k >= 0; k--) {
    if (T >= pending[k].at) {
      const p = pending[k];
      burst(OX + p.x, OY + p.y, ['#f0d695', '#ffffff', '#93d963', '#e7ca85'], 7, 70, 20);
      pending.splice(k, 1);
    }
  }
  drawScene();
  drawClouds(dt);
  drawRainTint();
  applyTint();
  drawFireflies();
  drawLights();
  drawRain(dt);
  drawDrift();
  drawParticles(dt);
  drawBirds(dt);
}

   ===================================================================== */
function logicalToClient(x, y) {
  const r = cv.getBoundingClientRect();
  return { x: r.left + x / W * r.width, y: r.top + y / H * r.height };
}
function hotClientPos(type) {
  const p = hotPos(type);
  return logicalToClient(p.x, p.y - 14);
}

let newAch = 0;
function paintBadgeA() { const n = newAch + qEl.ready + (dEl.can ? 1 : 0); badgeA.hidden = n < 1; badgeA.textContent = n; }
function runAch(silent) {
  const got = checkAch();
  if (!got.length) return;
  if (!silent) {
    newAch += got.length; paintBadgeA();
    got.forEach((a, i) => setTimeout(() => toast('Erfolg: ' + a.name + ' (+0,5 % Ertrag)'), i * 300));
    sfx.buy();
  }
  updateAch(); updateHud(); updateShop(); save();
}

function doCollect(type, clientX, clientY) {
  const { amt, crit } = collect(type);
  if (crit) sfx.crit(); else sfx[type]();
  hotEffect(type, crit);
  floatText(type, amt, crit, clientX, clientY);
  updateHud();
  popEl(chipRefs[type].val);
  if (S.clicks === 12) hintEl.classList.add('off');
  checkMilestones();
}

function claimDrift() {
  const p = driftPos();
  if (!p) return;
  const kind = drift.kind;
  drift = null;
  const res = claimFind(kind);
  const c = logicalToClient(p.x, p.y - 10);
  burst(p.x, p.y - 6, ['#f5be4e', '#fff3b0', '#ffffff', '#8fd3c9'], 16, 90, 30);
  sfx.crit();
  if (kind === 'bottle') {
    floatMsg('Rückenwind ×' + BUFF_MULT + '!', c.x, c.y);
    toast('Flaschenpost! Dein Ertrag ist ' + BUFF_SEC + ' Sekunden lang ×' + BUFF_MULT + '.');
  } else {
    floatMsg('Schatztruhe!', c.x, c.y);
    toast('Schatztruhe: ' + RES.filter(r => res.got[r] >= 1).map(r => '+' + fmt(res.got[r]) + ' ' + RES_NAME[r]).join(', '));
  }
  updateHud(); updateShop(); updatePills();
  checkMilestones();
  runAch();
}

function checkMilestones() {
  let up = 0, last = null;
  while (nextMilestone() && milestoneMet(nextMilestone())) { last = nextMilestone(); S.stage++; up++; }
  if (!up) return;
  onStageUp(last, up);
}
function onStageUp(m, count) {
  sfx.grow();
  updateStageName();
  buildGoal();
  if (count > 1) { rebuildCache(); syncVisuals(true); layout(true); } else onExpand();
  const nb = BUILDINGS.filter(b => b.stage > S.stage - count && b.stage <= S.stage).map(b => b.isle ? b.name + ' (Reisen)' : b.name);
  showBanner(m, 'Insel erweitert', nb.length ? 'Neu im Shop: ' + nb.join(', ') : '');
  toast('Neue Stufe: ' + STAGE_NAMES[S.stage] + (nb.length ? ' · Neu: ' + nb.join(', ') : ''));
  updateShop();
  runAch();
  save();
}

function save() {
  if (writeSave()) {
    savedEl.classList.add('on');
    clearTimeout(save.t); save.t = setTimeout(() => savedEl.classList.remove('on'), 1400);
  }
}

function catchUp(seconds) {
  const secs = Math.min(seconds, OFFLINE_MAX), eff = offlineEff();
  const before = {};
  for (const r of RES) before[r] = S.total[r];
  const step = Math.max(2, secs / 900);
  for (let left = secs; left > 0; left -= step) produce(Math.min(step, left), eff);
  const got = RES.map(r => [r, S.total[r] - before[r]]).filter(x => x[1] >= 1).sort((a, b) => b[1] * RES_VALUE[b[0]] - a[1] * RES_VALUE[a[0]]).slice(0, 4).map(x => '+' + fmt(x[1]) + ' ' + RES_NAME[x[0]]);
  if (got.length) {
    const mins = Math.max(1, Math.round(secs / 60));
    toast('Willkommen zurück! In ' + mins + ' Min. kamen (zu ' + Math.round(eff * 100) + ' %) ' + got.join(', ') + ' zusammen.');
  }
}

const autoGain = Object.fromEntries(RES.map(r => [r, 0]));
function autoFloats() {
  for (const r of RES) {
    const amt = autoGain[r]; autoGain[r] = 0;
    if (amt < 1) continue;
    const b = PRODUCERS.find(x => x.res === r && shown[x.id] > 0);
    if (!b) continue;
    const slot = slotsOf(b.id)[0];
    const c = logicalToClient(OX + sx(slot[0], slot[1]), OY + sy(slot[0], slot[1]) - 30);
    floatAuto(r, amt, c.x, c.y);
  }
}

/* the helper upgrade: each level is one helper clicking once a second for 25 % of a click (income itself is paid continuously) */
const hv = { acc: 0, flip: 0 };
function helperClicks(real) {
  const lvl = ulv('helper');
  if (!lvl || real > 1) return;
  const per = Math.min(lvl, 4);                      /* visible clicks per second, alternating wood and stone */
  hv.acc += real * per;
  for (let n = 0; hv.acc >= 1 && n < 3; n++) {
    hv.acc -= 1;
    const type = hv.flip++ % 2 ? 'stone' : 'wood';
    hotEffect(type, false);
    sfx.help(type);
    const p = hotClientPos(type);
    floatAuto(type, helperRate(type) / (per / 2), p.x, p.y);
  }
  if (hv.acc > 3) hv.acc = 0;
}

  const gap = bootGap;
  if (migrated) setTimeout(() => toast('Große Neuerung: Die Inselwirtschaft wurde komplett überarbeitet. Deine Insel startet neu, Perlen, Erfolge und Statistik bleiben erhalten.'), 800);
  else if (gap > 30) { catchUp(gap); checkMilestones(); updateHud(); updateShop(); }
}

let last = performance.now(), hudAcc = 0, shopAcc = 0, saveAcc = 0, achAcc = 0, autoAcc = 0, slowAcc = 0;
function loop(now) {
  const real = Math.max(0, (now - last) / 1000);
  last = now;
  if (real > 30) { catchUp(real); for (const r of RES) autoGain[r] = 0; }
  else {
    produce(real);
    helperClicks(real);
    const p = production();
    for (const r of RES) autoGain[r] += Math.max(0, p[r]) * real;
  }
  checkMilestones();
  render(Math.min(real, 0.05));
  hudAcc += real; shopAcc += real; saveAcc += real; achAcc += real; autoAcc += real; slowAcc += real;
  if (hudAcc > 0.1) { hudAcc = 0; updateHud(); updateGoal(); updatePills(); updateEventUI(); }
  if (shopAcc > 0.3) { shopAcc = 0; updateShop(); updateQuests(); updateTrips(); }
  if (achAcc > 0.7) { achAcc = 0; runAch(); }
  if (autoAcc > 2.4) { autoAcc = 0; autoFloats(); }
  if (slowAcc > 1) {
    slowAcc = 0;
    if (!listM.hidden) updateMore();
    if (!listA.hidden) updateAch();
  }
  if (saveAcc > 8) { saveAcc = 0; save(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
